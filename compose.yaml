services:
  backend:
    build:
      context: ./backend
    image: relay-backend:dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - relay-network

  frontend:
    build:
      context: ./frontend
    image: relay-frontend:dev
    restart: unless-stopped
    environment:
       API_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend
    networks:
      - relay-network

networks:
  relay-network:
    driver: bridge